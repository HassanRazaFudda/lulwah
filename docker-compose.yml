# docker-compose.yml — PRODUCTION (and staging, via a second `.env` + `-p`
# project name — see plan.md §25.1/§36.9). Adapted from plan.md §36.5.
#
# Deliberate deviations from the doc's literal example, and why:
#
#   - Component versions bumped past what §36.5's code block shows, per the
#     §0 changelog (1.2): mongo:7 → mongo:8, redis:7-alpine → redis:8-alpine,
#     meilisearch v1.11 → v1.48.
#   - Added a `mongo-init` one-shot service (see scripts/mongo-init.js)
#     instead of relying solely on the manual `docker compose exec mongo
#     mongosh --eval 'rs.initiate(...)'` step shown in prose in §36.6.
#     §36.6 itself calls the missing replica set "the single most common way
#     this stack breaks in production" — automating it removes the one
#     manual step most likely to be skipped on a fresh server or after a
#     volume was recreated. It is idempotent and safe to leave in place
#     permanently; §36.6's manual commands still work unchanged as a
#     verification step (`docker compose exec mongo mongosh --eval
#     'rs.status().ok'`).
#   - `web`/`admin`/`api` reference `ghcr.io/ORG/lulwah-*:${TAG}` images only
#     — no `build:` stanzas. Per §25.2 this is non-negotiable: images are
#     built in CI and only ever pulled here. Building `next build` on this
#     8 GB box can OOM-kill MongoDB mid-order (§36.1, §36.10 gotcha #6).
#     Replace `ORG` with the actual GitHub org/user before first deploy.
#
# No data-service ports are published to the host. Mongo, Redis and
# Meilisearch are reachable only on the internal compose network — see the
# gotcha in §36.10 #1 (Docker rewrites iptables directly, so a published
# port bypasses ufw entirely regardless of firewall rules).

name: lulwah

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    # NOT in the doc's §36.5 example, but required: caddy/Caddyfile reads
    # {$ACME_EMAIL} and {$STAGING_BCRYPT_HASH} from its process environment.
    # Without env_file here, Caddy fails to start ("wrong argument count"
    # parsing the `email` directive, since the placeholder expands to
    # empty). Both must be present in .env — see .env.example.
    env_file: [.env]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging: *logging
    depends_on: [web, admin, api]

  web:
    image: ghcr.io/ORG/lulwah-web:${TAG}
    restart: unless-stopped
    env_file: [.env]
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    mem_limit: 640m
    healthcheck:
      # 127.0.0.1, not localhost -- see the meilisearch healthcheck comment
      # in docker-compose.dev.yml for why: on these Alpine-based images,
      # localhost resolves to ::1 before 127.0.0.1, but the app only binds
      # 0.0.0.0 (IPv4), so a "localhost" healthcheck reliably fails even
      # though the app is healthy. Reproduced and confirmed in dev.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    depends_on: { api: { condition: service_healthy } }

  admin:
    image: ghcr.io/ORG/lulwah-admin:${TAG}
    restart: unless-stopped
    env_file: [.env]
    environment: { PORT: "3001" }
    mem_limit: 384m
    healthcheck:
      # 127.0.0.1, not localhost -- see the web service's healthcheck comment above.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  api:
    image: ghcr.io/ORG/lulwah-api:${TAG}
    restart: unless-stopped
    env_file: [.env]
    environment: { WORKER: "false" }
    deploy: { replicas: 2 }
    mem_limit: 320m
    healthcheck:
      # 127.0.0.1, not localhost -- see the web service's healthcheck comment above.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    image: ghcr.io/ORG/lulwah-api:${TAG}
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: [.env]
    environment: { WORKER: "true" }
    mem_limit: 384m
    logging: *logging
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }

  mongo:
    image: mongo:8
    restart: unless-stopped
    command: >
      mongod --replSet rs0 --bind_ip_all
             --wiredTigerCacheSizeGB 1
             --slowms 100
    volumes:
      - mongo_data:/data/db
    mem_limit: 2048m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    # NOT published to the host — reachable only on the compose network

  # One-shot: initializes the rs0 replica set once mongo is healthy.
  # Idempotent — see scripts/mongo-init.js and plan.md §36.6. This is the
  # step that makes multi-document transactions (order placement) work at
  # all; without it checkout fails with "Transaction numbers are only
  # allowed on a replica set member or mongos".
  mongo-init:
    image: mongo:8
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./scripts/mongo-init.js:/scripts/mongo-init.js:ro
    entrypoint: ["mongosh", "--host", "mongo:27017", "/scripts/mongo-init.js"]
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
                   --maxmemory 384mb --maxmemory-policy allkeys-lru
                   --appendonly yes --appendfsync everysec
    volumes: [redis_data:/data]
    mem_limit: 512m
    logging: *logging
    # NOT published to the host — reachable only on the compose network

  meilisearch:
    image: getmeili/meilisearch:v1.48
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes: [meili_data:/meili_data]
    mem_limit: 640m
    logging: *logging
    # NOT published to the host — reachable only on the compose network

  imgproxy:
    image: darthsim/imgproxy:latest
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: ${S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_TTL: "31536000"
      IMGPROXY_WORKERS: "2"
    mem_limit: 384m
    logging: *logging

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes: [kuma_data:/app/data]
    mem_limit: 256m
    logging: *logging

volumes:
  caddy_data: {}
  caddy_config: {}
  mongo_data: {}
  redis_data: {}
  meili_data: {}
  kuma_data: {}
